name: Verify translation word practice
on:
  push:
    branches: [codex/translation-word-practice]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check word exercise logic
        run: node test-word-practice.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check both translation directions and mobile UI
        run: node test-word-practice-browser.mjs
