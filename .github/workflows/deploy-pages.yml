name: Deploy Suomi-Satztrainer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check classroom UI behavior
        run: node test-classroom-assignment-ui.mjs
      - name: Check translation word exercise
        run: |
          node --check dist/app.js
          node test-auth-sync.mjs
          node test-review-plan.mjs
          node test-word-practice.mjs
          node test-suchsel.mjs
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node test-word-practice-browser.mjs
          node test-suchsel-browser.mjs
          node test-home-browser.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
