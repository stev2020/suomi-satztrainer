name: Deploy Suomi-Satztrainer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Jobs get only what they need: the tests can read the code, nothing else.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Tests install third-party packages (Playwright). They run in their own job
  # without any Pages permissions, so nothing they download can touch the
  # files that are published.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check classrooms (UI, stream, database)
        run: |
          npm install --no-save --package-lock=false happy-dom@20.8.4 @electric-sql/pglite@0.5.8
          npm run test:classrooms
      - name: Check translation word exercise
        run: |
          node --check dist/app.js
          node scripts/check-csp.mjs
          node test-auth-sync.mjs
          node test-auth-refresh.mjs
          node test-account-deletion.mjs
          node test-games.mjs
          node test-learning-path.mjs
          node test-review-plan.mjs
          node test-word-practice.mjs
          node test-suchsel.mjs
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node test-word-practice-browser.mjs
          node test-suchsel-browser.mjs
          node test-home-browser.mjs
          node test-games-browser.mjs
          node test-turnstile-browser.mjs
          node test-classrooms.mjs

  # A fresh checkout: only files from the repository are published.
  deploy:
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
