name: Verify word lookup and endings
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check lexicon coverage and word boundaries
        run: python build_dialogs.py build && node test-word-lookup.mjs && node test-endings.mjs && node test-translation-feedback.mjs && node test-difficult-words.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check tapping words on desktop and mobile
        run: node test-word-lookup-browser.mjs && node test-endings-browser.mjs && node test-translation-feedback-browser.mjs && node test-dialogs-browser.mjs && node test-difficult-words-browser.mjs && node test-i18n-browser.mjs
