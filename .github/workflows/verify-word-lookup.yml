name: Verify word lookup and endings
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check lexicon coverage and word boundaries
        run: node test-word-lookup.mjs && node test-endings.mjs && node test-translation-feedback.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check tapping words on desktop and mobile
        run: node test-word-lookup-browser.mjs && node test-endings-browser.mjs && node test-translation-feedback-browser.mjs
