name: Verify Suchsel
on:
  push:
    branches: [codex/suchsel]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify puzzle and existing learning logic
        run: |
          node --check dist/app.js
          node test-suchsel.mjs
          node test-word-practice.mjs
          node test-grammar.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test Suchsel and translation UI
        run: |
          node test-suchsel-browser.mjs
          node test-word-practice-browser.mjs
