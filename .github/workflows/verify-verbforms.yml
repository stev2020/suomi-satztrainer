name: Verify verb practice
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax and learning behavior
        run: |
          node --check dist/app.js
          node --check dist/auth.js
          node test-verbforms.mjs
          node test-auth-sync.mjs
          node test-grammar.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check mobile, desktop and persistence
        run: node test-verbforms-browser.mjs
      - name: Check home exercise selection and review launches
        run: node test-home-browser.mjs
        env:
          HOME_SCREENSHOTS: ${{ runner.temp }}
      - name: Save home previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: home-previews
          path: ${{ runner.temp }}/home-*.png
