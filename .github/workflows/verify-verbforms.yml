name: Verify verb practice
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and learning behavior
        run: |
          node --check dist/app.js
          node --check dist/auth.js
          node test-verbforms.mjs
          node test-auth-sync.mjs
          node test-grammar.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check mobile, desktop and persistence
        run: node test-verbforms-browser.mjs
      - name: Check home exercise selection and review launches
        run: node test-home-browser.mjs
        env:
          HOME_SCREENSHOTS: ${{ runner.temp }}
      - name: Save home previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-previews
          path: ${{ runner.temp }}/home-*.png
